version: '3'
services:
  app:
    build: .
    volumes:
      - ./entrypoint.sh:/app/entrypoint.sh
      - ./db/seeds.rb:/app/db/seeds.rb
      - ./tmp/pids:/app/tmp/pids
    #   - .:/app
    #   - bundle:/usr/local/bundle
    #   - node_modules:/app/node_modules
    environment:
      - DATABASE_URL=postgres://postgres:decidim@db/decidim_saas_development
      - SECRET_KEY_BASE=02b1511d769fcf6aec3a816f202e524f7c0fd12080ebd3aa18cfbb141c4d1307213124e93cba1b1547c296f00c3ccaa9a5995e5b9747ba2cf91cde0fa5a44f19
      - DECIDIM_FORCE_SSL=false
    ports:
      - 3000:3000
    depends_on:
      - db
  db:
    image: postgres:16
    ports:
      - "54321:5432"
    environment:
      - POSTGRES_PASSWORD=decidim
      - POSTGRES_USER=postgres
      - POSTGRES_DB=decidim_saas_development
    volumes:
      - pg_data:/var/lib/postgresql/data
volumes:
  pg_data:
  # bundle:
  # node_modules:
